# Server
server.port=8080

# Database (H2 in-memory for development)
spring.datasource.url=jdbc:h2:mem:magicauthdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# For production, replace H2 with PostgreSQL/MySQL:
# spring.datasource.url=jdbc:postgresql://localhost:5432/magicauth
# spring.datasource.username=postgres
# spring.datasource.password=yourpassword
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Frontend URL (for magic link)
app.frontend-url=http://localhost:3000

# Email (Gmail SMTP example)
# Replace with your SMTP provider
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${USERNAME}
spring.mail.password=${PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Logging
logging.level.com.magicauth=DEBUG
